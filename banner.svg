
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 384" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="spaceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36543e" />
      <stop offset="28%" stop-color="#183d3b" />
      <stop offset="65%" stop-color="#0e2d2c" />
      <stop offset="100%" stop-color="#091f1f" />
    </linearGradient>

    <!-- Emerald Nebula Glow (Bottom-Left) -->
    <radialGradient id="emeraldNebula" cx="12%" cy="88%" r="62%">
      <stop offset="0%" stop-color="#4b7b59" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#225648" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#133a36" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a2222" stop-opacity="0" />
    </radialGradient>

    <!-- Teal Ambient Nebula Glow (Center-Top) -->
    <radialGradient id="tealNebula" cx="55%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#1f4d47" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#11312f" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#091f1f" stop-opacity="0" />
    </radialGradient>

    <!-- Laptop Screen Glow onto Mascot -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Shimmer Beam for Title -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Orbit Comet Particle Gradient -->
    <linearGradient id="cometPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
       /*--- Starfield Twinkle Animations --- */
      .star { animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
      .star-1 { animation-name: tw1; animation-duration: 2.8s; }
      .star-2 { animation-name: tw2; animation-duration: 3.4s; animation-delay: 0.7s; }
      .star-3 { animation-name: tw3; animation-duration: 4.1s; animation-delay: 1.5s; }
      .star-4 { animation-name: tw4; animation-duration: 3.1s; animation-delay: 2.1s; }
      @keyframes tw1 { 0%, 100% { opacity: 0.35; transform: scale(0.9); } 50% { opacity: 0.95; transform: scale(1.3); } }
      @keyframes tw2 { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 0.85; transform: scale(1.2); } }
      @keyframes tw3 { 0%, 100% { opacity: 0.4; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.35); } }
      @keyframes tw4 { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 0.8; transform: scale(1.15); } }

      /* --- 3D Retro Typography --- */
      .retro-3d {
        font-family: 'Impact', 'Arial Black', 'Trebuchet MS', -apple-system, BlinkMacSystemFont, sans-serif;
        font-style: italic;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .t-shadow { fill: #0a2321; }
      .t-3d { fill: #ff7555; }
      .t-front {
        fill: #fff2e2;
        stroke: #162a26;
        stroke-width: 2.8px;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }
      .title-shimmer {
        animation: shimmer-sweep 6s ease-in-out infinite;
      }
      @keyframes shimmer-sweep {
        0%, 75% { transform: translateX(-550px) skewX(-15deg); opacity: 0; }
        85% { opacity: 0.45; }
        95%, 100% { transform: translateX(550px) skewX(-15deg); opacity: 0; }
      }

      /* --- Mascot Animations --- */
      .astronaut-group {
        transform-origin: 792px 180px;
        animation: zero-g 4.6s ease-in-out infinite;
      }
      @keyframes zero-g {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-1deg); }
      }

      .paw-left { animation: type-l 0.55s ease-in-out infinite alternate; }
      .paw-right { animation: type-r 0.55s ease-in-out infinite alternate 0.27s; }
      @keyframes type-l { 0% { transform: translateY(0px); } 100% { transform: translateY(-2.5px); } }
      @keyframes type-r { 0% { transform: translateY(0px); } 100% { transform: translateY(-2.5px); } }

      .antenna-l { transform-origin: 775px 130px; animation: ant-l 2.3s ease-in-out infinite; }
      .antenna-r { transform-origin: 808px 130px; animation: ant-r 2.3s ease-in-out infinite 0.4s; }
      @keyframes ant-l { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
      @keyframes ant-r { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }

      .screen-glow { animation: scr-flicker 2.5s ease-in-out infinite; }
      @keyframes scr-flicker { 0%, 100% { opacity: 0.25; } 30% { opacity: 0.45; } 60% { opacity: 0.3; } 80% { opacity: 0.5; } }

      .laptop-star { transform-origin: 814px 233px; animation: star-pulse 2.3s ease-in-out infinite; }
      @keyframes star-pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.2); opacity: 1; } }

      .planet-group { transform-origin: 695px 140px; animation: plt-drift 6.2s ease-in-out infinite; }
      @keyframes plt-drift { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(4.5px) rotate(1.2deg); } }

      .orbit-comet { stroke-dasharray: 20 620; animation: comet-race 4.2s linear infinite; }
      @keyframes comet-race { 0% { stroke-dashoffset: 640; } 100% { stroke-dashoffset: 0; } }

      .sparkle-big { transform-origin: 875px 118px; animation: sp-big 6s linear infinite; }
      @keyframes sp-big { 0% { transform: rotate(0deg) scale(0.9); opacity: 0.75; } 50% { transform: rotate(180deg) scale(1.2); opacity: 1; } 100% { transform: rotate(360deg) scale(0.9); opacity: 0.75; } }

      .sparkle-mid { transform-origin: 718px 192px; animation: sp-mid 3.2s ease-in-out infinite; }
      @keyframes sp-mid { 0%, 100% { transform: scale(0.85); opacity: 0.7; } 50% { transform: scale(1.25); opacity: 1; } }

      .cache-sticker {
        transform-origin: 137px 327px;
        animation: sticker-wiggle 7s ease-in-out infinite;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .cache-sticker:hover { transform: scale(1.06) rotate(-2deg); }
      @keyframes sticker-wiggle {
        0%, 82%, 100% { transform: rotate(0deg) scale(1); }
        84% { transform: rotate(-3deg) scale(1.03); }
        88% { transform: rotate(3deg) scale(1.03); }
        92% { transform: rotate(-2deg); }
        96% { transform: rotate(1deg); }
      }

      .term-cursor { animation: cur-blink 1s steps(2, start) infinite; }
      @keyframes cur-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      /* Typography */
      .mono-label { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; letter-spacing: 3.5px; fill: #7ea499; }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .terminal-code { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 400; letter-spacing: 0.5px; fill: #67968a; }
      .terminal-code-dark { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 500; letter-spacing: 1.5px; fill: #739f93; }
      .terminal-sleep { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 400; letter-spacing: 2px; fill: #648e83; }
      .badge-text { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #162f2a; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1024" height="384" fill="url(#spaceGrad)" />
  <rect width="1024" height="384" fill="url(#emeraldNebula)" />
  <rect width="1024" height="384" fill="url(#tealNebula)" />

  <!-- STARFIELD -->
  <g id="starfield">
    <circle cx="667.6" cy="40.7" r="1.3" fill="#ffffff" class="star star-1" />
    <circle cx="160.8" cy="274.5" r="1.1" fill="#82e1c3" class="star star-2" />
    <circle cx="295.2" cy="18.9" r="1.7" fill="#ffcd87" class="star star-3" />
    <circle cx="963.8" cy="151.7" r="1.5" fill="#a5f3fc" class="star star-4" />
    <circle cx="604.2" cy="98.0" r="1.2" fill="#ffffff" class="star star-1" />
    <circle cx="59.0" cy="189.7" r="1.0" fill="#82e1c3" class="star star-2" />
    <circle cx="952.9" cy="30.5" r="1.3" fill="#ffcd87" class="star star-3" />
    <circle cx="589.6" cy="15.8" r="0.9" fill="#a5f3fc" class="star star-4" />
    <circle cx="941.1" cy="99.7" r="1.4" fill="#ffffff" class="star star-1" />
    <circle cx="39.7" cy="80.6" r="1.8" fill="#82e1c3" class="star star-2" />
    <circle cx="612.9" cy="239.5" r="1.6" fill="#ffcd87" class="star star-3" />
    <circle cx="941.5" cy="245.5" r="1.2" fill="#a5f3fc" class="star star-4" />
    <circle cx="21.5" cy="226.3" r="1.5" fill="#ffffff" class="star star-1" />
    <circle cx="560.1" cy="74.1" r="1.1" fill="#82e1c3" class="star star-2" />
    <circle cx="994.4" cy="76.6" r="1.7" fill="#ffcd87" class="star star-3" />
    <circle cx="628.7" cy="358.5" r="0.8" fill="#a5f3fc" class="star star-4" />
    <circle cx="380.2" cy="331.7" r="1.6" fill="#ffffff" class="star star-1" />
    <circle cx="521.1" cy="340.8" r="1.4" fill="#82e1c3" class="star star-2" />
    <circle cx="986.3" cy="204.6" r="1.0" fill="#ffcd87" class="star star-3" />
    <circle cx="493.5" cy="32.8" r="1.2" fill="#a5f3fc" class="star star-4" />
    <circle cx="403.4" cy="46.0" r="1.5" fill="#ffffff" class="star star-1" />
    <circle cx="347.1" cy="34.8" r="1.3" fill="#82e1c3" class="star star-2" />
    <circle cx="963.8" cy="326.6" r="1.6" fill="#ffcd87" class="star star-3" />
    <circle cx="323.5" cy="328.5" r="1.1" fill="#a5f3fc" class="star star-4" />
  </g>

  <!-- HEADER LABELS -->
  <text x="48" y="37" class="mono-label">GITHUB PRESENTS</text>
  

  <!-- HERO 3D RETRO TYPOGRAPHY -->
  <g id="hero-title" transform="skewX(-3)">
    <!-- ClipPath for Shimmer -->
    <clipPath id="textClip">
      <text x="40" y="140" font-size="84" class="retro-3d">VAIBHAV</text>
      <text x="40" y="228" font-size="84" class="retro-3d">CHAUDHARY</text>
    </clipPath>

    <!-- Layer 1: Dark Deep Drop Shadow -->
    <text x="46" y="146" font-size="84" class="retro-3d t-shadow">VAIBHAV</text>
    <text x="46" y="234" font-size="84" class="retro-3d t-shadow">CHAUDHARY</text>

    <!-- Layer 2: Coral 3D Extrusion -->
    <text x="43" y="143" font-size="84" class="retro-3d t-3d">VAIBHAV</text>
    <text x="43" y="231" font-size="84" class="retro-3d t-3d">CHAUDHARY</text>

    <!-- Layer 3: Warm Cream Front Face with Dark Outline -->
    <text x="40" y="140" font-size="84" class="retro-3d t-front">VAIBHAV</text>
    <text x="40" y="228" font-size="84" class="retro-3d t-front">CHAUDHARY</text>

    <!-- Layer 4: Shimmer Sweep -->
    <g clip-path="url(#textClip)">
      <rect x="0" y="60" width="120" height="190" fill="url(#shimmerGrad)" class="title-shimmer" />
    </g>
  </g>

  <!-- SUBTITLE -->
  <text x="48" y="296" class="subtitle">Building things. Breaking things.</text>

  <!-- STICKER BADGE -->
  <g class="cache-sticker">
    <rect x="51" y="315" width="178" height="30" rx="4" fill="#0c231f" />
    <rect x="48" y="312" width="178" height="30" rx="4" fill="#ffca72" stroke="#162f2a" stroke-width="1.8" />
    <text x="58" y="332" class="badge-text">Blaming the AI.</text>
  </g>

  <!-- TERMINAL CODE (BOTTOM LEFT) -->
  <g id="terminal-left">
    <text x="48" y="366" class="terminal-code">git commit -m &quot;it worked yesterday&quot;</text>
    <rect x="234" y="356" width="6.5" height="11" fill="#67968a" class="term-cursor" />
  </g>

  <!-- MICROCOPY (BOTTOM RIGHT) -->
  <g id="microcopy-right">
    <text x="652" y="333" class="terminal-code-dark">NO BUGS WERE HARMED.</text>
    <text x="652" y="346" class="terminal-code-dark">THEY&#39;RE ALL STILL HERE.</text>
   
  </g>

  <!-- MASCOT SCENE (RIGHT SIDE) -->
  <!-- 1. Orbit Base Track -->
  <path id="orbitPath"
        d="M 660 142 C 632 185, 672 268, 755 282 C 838 296, 898 262, 900 200 C 902 138, 842 82, 780 82 C 730 82, 685 105, 660 142" 
        fill="none" stroke="#fff6ea" stroke-width="2.6" stroke-linecap="round" opacity="0.85" />

  <!-- 2. Orbit Comet Pulse (Races smoothly around the track) -->
  <path d="M 660 142 C 632 185, 672 268, 755 282 C 838 296, 898 262, 900 200 C 902 138, 842 82, 780 82 C 730 82, 685 105, 660 142" 
        fill="none" stroke="url(#cometPulse)" stroke-width="4" stroke-linecap="round" class="orbit-comet" filter="url(#glow)" />

  <!-- 3. Floating Saturn Planet -->
  <g class="planet-group">
    <path d="M 662 140 C 660 133, 726 131, 732 138" fill="none" stroke="#162a26" stroke-width="4.5" />
    <path d="M 662 140 C 660 133, 726 131, 732 138" fill="none" stroke="#fff6ea" stroke-width="2.5" />
    <circle cx="695" cy="140" r="16" fill="#ffcd87" stroke="#162a26" stroke-width="3" />
    <path d="M 658 142 C 658 150, 724 153, 732 143 C 730 138, 660 138, 658 142 Z" fill="#fff6ea" stroke="#162a26" stroke-width="2.5" />
  </g>

  <!-- 4. Sparkle Stars -->
  <g class="sparkle-big" filter="url(#starGlow)">
    <path d="M 875 105.5 Q 875 118 887.5 118 Q 875 118 875 130.5 Q 875 118 862.5 118 Q 875 118 875 105.5 Z" fill="#fff6ea" />
  </g>
  <g class="sparkle-mid">
    <path d="M 718 183.5 Q 718 192 726.5 192 Q 718 192 718 200.5 Q 718 192 709.5 192 Q 718 192 718 183.5 Z" fill="#fff6ea" />
  </g>
  <g style="transform-origin: 910px 235px; animation: sp-mid 2.6s ease-in-out infinite 1s;">
    <path d="M 910 229.5 Q 910 235 915.5 235 Q 910 235 910 240.5 Q 910 235 904.5 235 Q 910 235 910 229.5 Z" fill="#fff6ea" />
  </g>

  <!-- 5. Floating Astronaut & Laptop -->
  <g class="astronaut-group">
    <!-- Crossed Legs & Space Boots -->
    <g id="legs-and-boots">
      <g transform="translate(741, 255)">
        <path d="M 2 16 C 6 21, 24 21, 28 15 C 27 21, 5 21, 2 16 Z" fill="#fff6ea" stroke="#162a26" stroke-width="2.6" stroke-linejoin="round" />
        <path d="M 5 15 C 2 11, 4 4, 12 2 C 20 2, 24 8, 25 15 Z" fill="#ff7555" stroke="#162a26" stroke-width="2.6" stroke-linejoin="round" />
      </g>
      <g transform="translate(815, 255)">
        <path d="M 4 15 C 8 21, 26 21, 30 16 C 29 21, 7 21, 4 15 Z" fill="#fff6ea" stroke="#162a26" stroke-width="2.6" stroke-linejoin="round" />
        <path d="M 7 15 C 4 8, 8 2, 16 2 C 24 4, 26 10, 27 15 Z" fill="#ff7555" stroke="#162a26" stroke-width="2.6" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Spacesuit Torso -->
    <path d="M 758 195 C 748 220, 755 260, 786 262 C 818 262, 826 240, 820 205 Z" fill="#50d0a5" stroke="#162a26" stroke-width="3" stroke-linejoin="round" />

    <!-- Suit Collar -->
    <path d="M 752 196 C 770 212, 810 212, 828 196 C 830 206, 750 206, 752 196 Z" fill="#fff6ea" stroke="#162a26" stroke-width="2.8" />
    <path d="M 760 202 C 775 210, 805 210, 820 202" fill="none" stroke="#ff7555" stroke-width="3" />

    <!-- Antennae -->
    <g class="antenna-l">
      <path d="M 776 130 C 772 120, 767 114, 766 108" fill="none" stroke="#162a26" stroke-width="2.8" stroke-linecap="round" />
      <circle cx="766" cy="107" r="5.5" fill="#ff7555" stroke="#162a26" stroke-width="2.5" />
    </g>
    <g class="antenna-r">
      <path d="M 806 130 C 810 120, 814 114, 816 108" fill="none" stroke="#162a26" stroke-width="2.8" stroke-linecap="round" />
      <circle cx="816" cy="107" r="5.5" fill="#ff7555" stroke="#162a26" stroke-width="2.5" />
    </g>

    <!-- Alien Head -->
    <ellipse cx="791" cy="158" rx="35" ry="31" fill="#50d0a5" stroke="#162a26" stroke-width="3" />

    <!-- Big Sparkling Eyes -->
    <g id="eye-left">
      <ellipse cx="780" cy="152" rx="9" ry="12.5" fill="#fff6ea" stroke="#162a26" stroke-width="2.6" />
      <ellipse cx="781" cy="153" rx="6" ry="8.5" fill="#162a26" />
      <circle cx="779" cy="150" r="2.5" fill="#ffffff" />
      <circle cx="783" cy="156" r="1.2" fill="#ffffff" />
    </g>
    <g id="eye-right">
      <ellipse cx="805" cy="152" rx="9" ry="12.5" fill="#fff6ea" stroke="#162a26" stroke-width="2.6" />
      <ellipse cx="806" cy="153" rx="6" ry="8.5" fill="#162a26" />
      <circle cx="804" cy="150" r="2.5" fill="#ffffff" />
      <circle cx="808" cy="156" r="1.2" fill="#ffffff" />
    </g>

    <!-- Cute Smiling Mouth -->
    <path d="M 784 168 Q 792 176 801 168" fill="none" stroke="#162a26" stroke-width="2.8" stroke-linecap="round" />

    <!-- Bubble Helmet Glass & Reflection -->
    <circle cx="791" cy="156" r="53" fill="none" stroke="#162a26" stroke-width="5" />
    <circle cx="791" cy="156" r="51" fill="none" stroke="#fff6ea" stroke-width="3.5" />
    <path d="M 748 135 A 48 48 0 0 1 785 109" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
    <path d="M 744 150 A 48 48 0 0 1 748 168" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Laptop Scene -->
    <g id="laptop-scene">
      <polygon points="768,235 848,210 868,245 780,255" fill="url(#screenGlow)" class="screen-glow" />
      <polygon points="760,248 836,254 826,266 750,258" fill="#fff6ea" stroke="#162a26" stroke-width="2.8" stroke-linejoin="round" />
      <line x1="766" y1="251" x2="828" y2="256" stroke="#162a26" stroke-width="1.5" />
      <polygon points="778,216 856,221 842,251 768,244" fill="#ff7555" stroke="#162a26" stroke-width="2.8" stroke-linejoin="round" />
      <g class="laptop-star">
        <path d="M 814 226.5 Q 814 233 820.5 233 Q 814 233 814 239.5 Q 814 233 807.5 233 Q 814 233 814 226.5 Z" fill="#fff6ea" />
      </g>
      <g class="paw-left">
        <ellipse cx="767" cy="244" rx="5.5" ry="4" fill="#50d0a5" stroke="#162a26" stroke-width="2.2" />
      </g>
      <g class="paw-right">
        <ellipse cx="785" cy="246" rx="5.5" ry="4" fill="#50d0a5" stroke="#162a26" stroke-width="2.2" />
      </g>
    </g>
  </g>
</svg>
