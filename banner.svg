<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Vaibhav Chaudhary — vigilante noir developer banner</title>
  <desc id="desc">A rain-soaked, gothic developer banner with a skyline and searchlight.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030814"/><stop offset=".52" stop-color="#0A1830"/><stop offset="1" stop-color="#17110B"/></linearGradient>
    <radialGradient id="cloud" cx="61%" cy="23%" r="60%"><stop stop-color="#34506E" stop-opacity=".48"/><stop offset=".52" stop-color="#13273C" stop-opacity=".2"/><stop offset="1" stop-color="#030814" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop stop-color="#FFF1BC" stop-opacity=".95"/><stop offset=".18" stop-color="#FFD66B" stop-opacity=".56"/><stop offset="1" stop-color="#FFD66B" stop-opacity="0"/></radialGradient>
    <linearGradient id="search" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#F9E9AB" stop-opacity=".20"/><stop offset="1" stop-color="#F9E9AB" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".8"/></filter>
 
    <style>
     
      .flash { animation: flash 8s linear infinite; }
      .beam { animation: beam 5s ease-in-out infinite; transform-origin:1335px 209px; }
      .city { animation: city 5s ease-in-out infinite; }
      .cursor { animation: cursor 1s steps(1,end) infinite; }
      .mist { animation: mist 10s ease-in-out infinite; }

      @keyframes flash { 0%,8%,100% { opacity:0 } 4% { opacity:.42 } 5% { opacity:0 } }
      @keyframes beam { 0%,100% { opacity:.38; transform:rotate(-2deg) } 50% { opacity:.75; transform:rotate(2deg) } }
      @keyframes city { 0%,100% { opacity:.78 } 50% { opacity:1 } }
      @keyframes cursor { 50% { opacity:0 } }
      @keyframes mist { 0%,100% { transform:translateX(-25px); opacity:.20 } 50% { transform:translateX(40px); opacity:.43 } }
    </style>
  </defs>

  <rect width="1600" height="560" fill="url(#night)"/>
  <rect width="1600" height="560" fill="url(#cloud)"/>
 
  <rect class="flash" width="1600" height="560" fill="#D7F4FF"/>

  <!-- Skyline -->
  <g class="city" fill="#050B13">
    <path d="M0 367h57v-87h29v87h49v-147h38v147h43v-89h32v89h58v-172h42v172h48v-112h30v112h46v-216h17l12-49 13 49h18v216h52v-94h27v94h56v-135h37v135h47v-196h14l16-75 17 75h13v196h60v-104h41v104h51v-163h35v163h42v-75h34v75h63v193H0z"/>
    <path d="M753 367v-244h26v-65h10v65h24v244zm-380 0V171h12v-46h8v46h13v196z" fill="#09131F"/>
  </g>

  <g fill="#E8C45C" opacity=".63">
    <path d="M150 250h10v30h-10zm22 61h9v19h-9zm157-87h10v29h-10zm84 77h9v24h-9zm359-145h8v22h-8zm185 151h9v28h-9zm179-93h10v34h-10zm96 74h9v23h-9zm143-88h11v30h-11z"/>
  </g>

  <!-- Searchlight -->
  <path class="beam" d="M1285 287L888 0h334l211 258z" fill="url(#search)"/>
  <circle cx="1337" cy="243" r="119" fill="url(#lamp)" opacity=".68" filter="url(#glow)"/>
  <circle cx="1337" cy="243" r="47" fill="#19293A" opacity=".9"/>
  <circle cx="1337" cy="243" r="44" fill="#FFF2B8"/>
 <path
  d="M4 43C4 16 27 4 68 0 49 12 45 26 65 35c17 7 29 7 38 4l4-26 9 21 8-21 5 26c9 3 22 3 39-4 20-9 16-23-3-35 41 4 64 16 64 43 0 29-24 47-51 54 14-15 16-26 5-30-11-5-18 4-29 16l-10 15-3-23c-9 10-15 18-25 35-10-17-16-25-25-35l-3 23-10-15c-11-12-18-21-29-16-11 4-9 15 5 30C28 90 4 72 4 43Z"
  transform="translate(1292 220) scale(.39)"
  fill="#050A12"
/>

  <!-- Header -->
  <path d="M60 67h1480" stroke="#C5B27D" stroke-opacity=".28"/>
  <g font-family="monospace" font-size="14" letter-spacing="4" fill="#F2D89C">
    <text x="60" y="49">GITHUB PRESENTS</text>
  </g>

  <!-- Name -->
  <g filter="url(#shadow)">
    <text x="60" y="212" fill="#F4E7C6" font-family="Impact, Haettenschweiler, sans-serif" font-size="104" letter-spacing="3">VAIBHAV</text>
    <text x="60" y="343" fill="#F4E7C6" font-family="Impact, Haettenschweiler, sans-serif" font-size="104" letter-spacing="3">CHAUDHARY</text>
  </g>

  <!-- Tagline -->
  <path d="M62 382h74" stroke="#F2D15F" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">
    <text x="60" y="433" fill="#F6F0E1">No bugs were harmed</text>
    <text x="60" y="471" fill="#F2C95D">They are still here.</text>
  </g>

 
 
  <!-- Animated rain -->
  <rect class="rain" width="1600" height="560" fill="url(#rain)"/>
</svg>